    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9e7e1;
        font-family: Inter, system-ui, sans-serif;
        color: #1d211e;
      }
      .lab {
        padding: 14px 18px;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        border-bottom: 1px solid #d5d2ca;
        background: #f2f1ec;
        position: sticky;
        top: 0;
        z-index: 50;
      }
      .lab b {
        font-weight: 800;
      }
      .lab a {
        font-size: 12px;
        border: 1px solid #cfccc4;
        background: #fff;
        border-radius: 999px;
        padding: 6px 10px;
        color: inherit;
        text-decoration: none;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        padding: 18px;
      }
      .gcell {
        background: #fff;
        border: 1px solid #d5d2ca;
        border-radius: 12px;
        overflow: hidden;
      }
      .gcell h3 {
        margin: 0;
        padding: 10px 12px;
        font-size: 13px;
        border-bottom: 1px solid #e3e0d8;
      }
      .gcell h3 span {
        color: #7a807b;
        font-weight: 400;
        font-size: 11px;
        margin-left: 6px;
      }
      .shell {
        overflow: hidden;
        background: #d9d9d4;
      }
      .scale {
        transform-origin: top left;
      }
      .vp {
        background: #fff;
        overflow: hidden;
      }
      .vp.gray {
        filter: grayscale(1);
      }
      #measure {
        display: none;
      }

      /* ---------- site base (page system) ---------- */
      .site {
        font-family: var(--body);
        color: var(--t-text);
        background: var(--t-base);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .site h1,
      .site h2,
      .site h3 {
        font-family: var(--display);
        font-weight: var(--display-weight, 600);
        margin: 0;
        letter-spacing: var(--tracking);
        line-height: 1.02;
      }
      .site h3 {
        font-size: 1.2rem;
        line-height: 1.15;
      }
      .site p {
        margin: 0;
        max-width: var(--measure);
      }
      .site .kicker {
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.68rem;
        font-weight: 700;
        opacity: 0.85;
      }
      .site .muted {
        opacity: 0.74;
      }
      .site .small {
        font-size: 0.85rem;
      }
      .surf-base {
        --bg: var(--t-base);
        --fg: var(--t-text);
        --acc: var(--t-acc-base);
        --acc-fg: var(--t-acc-base-fg);
      }
      .surf-alt {
        --bg: var(--t-alt);
        --fg: var(--t-text);
        --acc: var(--t-acc-base);
        --acc-fg: var(--t-acc-base-fg);
      }
      .surf-contrast {
        --bg: var(--t-contrast);
        --fg: var(--t-contrast-text);
        --acc: var(--t-acc-contrast);
        --acc-fg: var(--t-acc-contrast-fg);
      }
      .surf-accent {
        --bg: var(--t-acc-base);
        --fg: var(--t-acc-base-fg);
        --acc: var(--t-base);
        --acc-fg: var(--t-text);
      }
      .surf-contrast .surf-accent {
        --bg: var(--t-acc-contrast);
        --fg: var(--t-acc-contrast-fg);
        --acc: var(--t-contrast);
        --acc-fg: var(--t-contrast-text);
      }
      .sec {
        background: var(--bg);
        color: var(--fg);
        padding: var(--pad-y) 0;
      }
      .sec.kind-band {
        padding: 0;
      }
      .sec .inner {
        width: min(1120px, calc(100% - 48px));
        margin: 0 auto;
      }
      .sec.al-start .inner {
        margin-left: 24px;
      }
      .sec.al-end .inner {
        margin-right: 24px;
        margin-left: auto;
      }
      .sec.al-center {
        text-align: center;
      }
      .sec.al-center p {
        margin-left: auto;
        margin-right: auto;
      }
      .sec.al-end {
        text-align: right;
      }
      .sec.al-end p {
        margin-left: auto;
      }
      .sec.fill-screen {
        min-height: var(--hero-h);
        display: flex;
        align-items: center;
      }
      .sec.fill-screen .inner {
        width: min(1120px, calc(100% - 48px));
      }
      .sec.kind-hero.fill-screen .inner {
        flex: 1;
      }
      .sec.kind-hero.fill-screen .inner > .p-frame,
      .sec.kind-hero.fill-screen .inner > .p-overlay,
      .sec.kind-hero.fill-screen .inner > .p-split,
      .sec.kind-hero.fill-screen .inner > .p-rail,
      .sec.kind-hero.fill-screen .inner > .p-surface {
        min-height: calc(var(--hero-h) - var(--pad-y) * 2);
      }
      .sec.kind-hero.fill-screen .inner > .p-frame {
        display: grid;
      }
      .p-frame .frame-box {
        display: grid;
        align-content: center;
      }
      .sec.kind-hero.fill-screen .inner > .p-overlay {
        display: grid;
      }
      .p-overlay .ov-content {
        display: grid;
        align-content: center;
      }
      .p-surface {
        display: grid;
        align-content: center;
      }
      .footer {
        padding: 28px 24px;
        text-align: center;
        font-size: 0.74rem;
        opacity: 0.7;
      }
      .site .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 20px;
        font-weight: 700;
        font-family: var(--body);
        text-decoration: none;
        cursor: pointer;
        background: var(--btn-bg);
        color: var(--btn-fg);
        border: var(--btn-border);
        border-radius: var(--btn-radius);
        letter-spacing: var(--btn-tracking);
        text-transform: var(--btn-transform);
        font-size: var(--btn-size);
      }
      .site .btn.ghost {
        background: transparent;
        color: inherit;
        border-color: currentColor;
      }
      .btn-underline .btn {
        min-height: auto;
        padding: 0 0 4px;
        border-bottom: 2px solid currentColor;
      }
      .site .link {
        text-decoration: underline;
        text-underline-offset: 4px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.78rem;
      }
      .site .fld {
        display: block;
      }
      .site .fld span {
        display: block;
        font-size: 0.76rem;
        font-weight: 700;
        margin-bottom: 7px;
      }
      .site input,
      .site textarea {
        width: 100%;
        font: inherit;
        color: inherit;
        padding: 12px 13px;
        background: transparent;
        border: var(--field-border);
        border-bottom: var(--field-border-b);
        border-radius: var(--btn-radius);
      }
      .site textarea {
        min-height: 84px;
        resize: none;
      }
      .site .err input {
        border-color: var(--t-error) !important;
        border-bottom-color: var(--t-error) !important;
      }
      .site .err-msg {
        font-size: 0.74rem;
        color: var(--t-error);
        margin-top: 6px;
      }
      .site .choice {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        padding: 9px 0;
        text-align: left;
      }
      .site .choice input {
        width: auto;
        margin-top: 4px;
      }
      .site .otp {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 7px;
        max-width: 360px;
      }
      .site .otp span {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border: 1px solid currentColor;
        font-weight: 800;
      }
      .site .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .site .card {
        padding: clamp(16px, 2.2vw, 26px);
        background: var(--card-bg);
        border: var(--card-border);
        outline: var(--card-outline);
        outline-offset: 5px;
      }
      .site .card,
      .site .card > *,
      .p-item,
      .p-registry .item.featured > * {
        min-width: 0;
      }
      .site .thumb {
        aspect-ratio: 1.1/1;
        display: grid;
        place-items: center;
        font-family: var(--display);
        background: var(--pattern-linen);
        border: var(--rule);
      }
      .site .glyphs {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        max-width: 100%;
      }
      .site .glyphs svg {
        flex-shrink: 1;
        max-width: 100%;
      }

      /* ---------- primitives ---------- */
      .p-stack {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        align-items: stretch;
        min-width: 0;
      }
      .p-stack.al-start {
        align-items: flex-start;
        text-align: left;
      }
      .p-stack.al-center {
        align-items: center;
        text-align: center;
      }
      .p-stack.al-end {
        align-items: flex-end;
        text-align: right;
      }
      .p-stack.al-center p,
      .p-stack.al-center .p-text {
        margin-left: auto;
        margin-right: auto;
      }
      .p-cluster {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--gap) * 0.6) var(--gap);
        align-items: center;
        min-width: 0;
      }
      .p-cluster.j-center {
        justify-content: center;
      }
      .p-cluster.j-end {
        justify-content: flex-end;
      }
      .p-cluster.j-between {
        justify-content: space-between;
      }
      .p-cluster .p-text {
        max-width: none;
      }
      .p-split {
        display: grid;
        grid-template-columns: var(--cols);
        gap: clamp(20px, 3vw, 40px);
        min-width: 0;
      }
      .p-split.al-start {
        align-items: start;
      }
      .p-split.al-center {
        align-items: center;
      }
      .p-split.al-stretch {
        align-items: stretch;
      }
      .p-split > * {
        min-width: 0;
      }
      .p-split.div-hairline > :first-child {
        border-right: var(--rule);
        padding-right: clamp(20px, 3vw, 40px);
      }
      .p-split.div-strong > :first-child {
        border-right: var(--rule-strong);
        padding-right: clamp(20px, 3vw, 40px);
      }
      .p-split.div-dashed > :first-child {
        border-right: 2px dashed color-mix(in srgb, currentColor 45%, transparent);
        padding-right: clamp(20px, 3vw, 40px);
      }
      .p-rail {
        display: grid;
        grid-template-columns: var(--rail-w) 1fr;
        gap: clamp(20px, 3vw, 40px);
        min-width: 0;
      }
      .p-rail.side-end {
        grid-template-columns: 1fr var(--rail-w);
      }
      .p-rail.side-end .rail {
        order: 2;
      }
      .p-rail .rail {
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-right: var(--rule-strong);
        padding-right: clamp(12px, 2vw, 24px);
      }
      .p-rail.side-end .rail {
        border-right: 0;
        border-left: var(--rule-strong);
        padding-right: 0;
        padding-left: clamp(12px, 2vw, 24px);
      }
      .p-rail .rail .p-field {
        height: 100%;
        min-height: 200px;
      }
      .p-rail .rail:has(> .p-field) {
        border: 0;
        padding: 0;
      }
      .p-rail.w-thin .rail .p-stack {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-weight: 700;
        align-items: center;
      }
      .p-rail.w-thin .rail .p-stack .p-text {
        white-space: nowrap;
      }
      .p-rail.w-thin .rail .p-text.t-Date.form-numeral {
        font-size: calc(var(--rail-w) * 0.7);
        line-height: 1;
      } /* a numeral in a thin rail is sized by the rail, not the type scale */
      .p-rail.w-medium .rail .p-text.t-Date.form-numeral.em-display,
      .p-rail.w-wide .rail .p-text.t-Date.form-numeral.em-display {
        font-size: calc(var(--rail-w) * 0.7);
        line-height: 1;
      }
      .p-rail .rail {
        overflow: hidden;
      }
      .p-rail .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .p-grid {
        display: grid;
        grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
        gap: var(--gap);
        min-width: 0;
      }
      .p-grid.ruled {
        gap: 0;
        border-top: var(--rule-strong);
        border-left: var(--rule);
      }
      .p-grid.ruled .p-cell {
        border-right: var(--rule);
        border-bottom: var(--rule);
        padding: clamp(18px, 2.4vw, 30px);
        min-height: 120px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .p-cell {
        grid-column: span var(--span);
        grid-row: span var(--rspan);
        min-width: 0;
      }
      .p-frame {
        padding: var(--inset);
      }
      .p-frame .frame-box {
        padding: clamp(24px, 4vw, 56px) clamp(20px, 4vw, 48px);
        position: relative;
        min-width: 0;
      }
      .p-frame,
      .p-surface,
      .p-overlay,
      .p-rail .main,
      .p-cell {
        min-width: 0;
      }
      .p-frame .rule-hairline {
        border: var(--rule);
      }
      .p-frame .rule-strong {
        border: var(--rule-strong);
      }
      .p-frame .rule-double {
        border: var(--rule);
        outline: var(--rule-outline);
        outline-offset: 8px;
      }
      .p-frame .rule-none {
        border: 0;
      }
      .p-surface {
        background: var(--bg);
        color: var(--fg);
        padding: var(--inset);
      }
      .p-surface.surf-accent {
        padding: calc(var(--inset) * 0.75) var(--inset);
      }
      .p-overlay {
        position: relative;
        min-width: 0;
      }
      .p-overlay .ov-content {
        position: relative;
        z-index: 1;
      }
      .p-overlay .ov-deco {
        position: absolute;
        z-index: 0;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .p-overlay .ov-deco .p-field {
        width: 100%;
        height: 100%;
        min-height: 0;
      }
      .p-overlay .ov-deco .p-text,
      .p-overlay .ov-deco .p-glyph {
        opacity: 0.12;
        pointer-events: none;
      } /* a decoration is a watermark: it never competes with text */
      .p-overlay .ov-deco .p-text.t-Date.form-numeral {
        font-size: calc(var(--display-size) * 3.2);
        line-height: 1;
        font-family: var(--display);
        font-weight: var(--display-weight-heavy);
      }
      .p-overlay.m-stack .ov-deco .p-text.t-Date.form-numeral {
        font-size: calc(var(--display-size) * 2);
      }
      .p-overlay.ext-full .ov-deco {
        inset: 0;
      }
      .p-overlay.ext-half .ov-deco {
        width: 60%;
        height: 50%;
      }
      .p-overlay.ext-third .ov-deco {
        width: 42%;
        height: 36%;
      }
      .p-overlay.ext-quarter .ov-deco {
        width: 32%;
        height: 26%;
      }
      .p-overlay.anchor-top-start .ov-deco {
        top: 0;
        left: 0;
      }
      .p-overlay.anchor-top-end .ov-deco {
        top: 0;
        right: 0;
      }
      .p-overlay.anchor-bottom-start .ov-deco {
        bottom: 0;
        left: 0;
      }
      .p-overlay.anchor-bottom-end .ov-deco {
        bottom: 0;
        right: 0;
      }
      .p-overlay.anchor-center .ov-deco {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .p-overlay:not(.ext-full) .ov-content {
        padding: clamp(24px, 4vw, 56px) 0;
      }
      .p-overlay.ext-full .ov-content {
        padding: 0;
      }
      .p-field {
        background: var(--pattern-linen);
        min-height: 200px;
        width: 100%;
      }
      .p-stack > .p-field.ext-full {
        min-height: calc(var(--hero-h) * 0.5);
      }
      .p-stack > .p-field.ext-half {
        min-height: calc(var(--hero-h) * 0.35);
      }
      .p-stack > .p-field.ext-third {
        min-height: calc(var(--hero-h) * 0.25);
      }
      .p-stack > .p-field.ext-quarter {
        min-height: calc(var(--hero-h) * 0.18);
      }
      .p-split > .p-field {
        min-height: 100%;
      }
      .p-band {
        width: 100%;
      }
      .p-band.accent {
        background: var(--acc);
      }
      .sec.kind-band .p-band {
        height: calc(var(--band-h, 48px) * 2);
      }
      .p-rule {
        border-top: var(--rule);
        width: 100%;
      }
      .p-rule.w-strong {
        border-top: var(--rule-strong);
      }
      .p-rule.w-double {
        border-top: 3px double currentColor;
      }
      .p-rule.v {
        border-top: 0;
        border-left: var(--rule);
        align-self: stretch;
        min-height: 1.4em;
        width: 0;
      }
      .p-divider {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
      }
      .p-divider:before,
      .p-divider:after {
        content: "";
        flex: 1;
        border-top: var(--rule);
      }
      .p-glyph {
        display: inline-flex;
      }
      .p-mono {
        display: grid;
        place-items: center;
        font-family: var(--display);
      }
      .p-mono.st-ring span {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        border: var(--rule);
        display: grid;
        place-items: center;
        font-size: 2.2rem;
      }
      .p-mono.st-plain span {
        font-size: 3rem;
        line-height: 1;
      }
      .p-mono.st-watermark span {
        font-size: calc(var(--display-size) * 5);
        line-height: 1;
        opacity: 0.1;
      }
      .p-text {
        min-width: 0;
        overflow-wrap: anywhere;
      } /* floor: a word can always break; demotion runs first, so this is the last resort */
      .p-text.em-display {
        font-family: var(--display);
        font-size: var(--display-size);
        line-height: 1.02;
        letter-spacing: var(--tracking);
        font-weight: var(--display-weight);
      }
      .p-text.em-primary {
        font-family: var(--display);
        font-size: var(--h2-size);
        line-height: 1.08;
        letter-spacing: var(--tracking);
      }
      .p-text.em-secondary {
        font-size: 1rem;
        max-width: var(--measure);
      }
      .p-text.em-caption {
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.68rem;
        font-weight: 700;
        opacity: 0.85;
      }
      .p-text.case-upper {
        text-transform: uppercase;
      }
      h1.p-text.em-display.case-upper {
        font-weight: var(--display-weight-heavy);
        line-height: 0.9;
      }
      h1.p-text.lay-stagger,
      h1.p-text.lay-cascade {
        display: flex;
        flex-direction: column;
        line-height: 0.9;
        font-weight: var(--display-weight-heavy);
      }
      h1.p-text.em-display.lay-stagger,
      h1.p-text.em-display.lay-cascade {
        font-size: calc(var(--display-size) * 1.05);
      }
      h1.p-text.em-primary.lay-stagger,
      h1.p-text.em-primary.lay-cascade {
        font-size: calc(var(--h2-size) * 1.15);
      }
      h1.p-text.em-secondary.lay-stagger,
      h1.p-text.em-secondary.lay-cascade {
        font-size: 1.4rem;
        font-family: var(--display);
      }
      h1.p-text.lay-stagger .line,
      h1.p-text.lay-cascade .line {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      h1.p-text.lay-stagger .line:nth-child(even) {
        text-align: right;
      }
      h1.p-text.lay-cascade .line:nth-child(2) {
        padding-left: 12%;
      }
      h1.p-text.lay-cascade .line:nth-child(3) {
        padding-left: 24%;
      }
      .p-text.t-Date.form-numeral.em-display {
        font-size: calc(var(--display-size) * 1.6);
        line-height: 0.85;
        font-weight: var(--display-weight-heavy);
      }
      .p-text.t-Date.form-numeral.em-primary {
        font-size: calc(var(--h2-size) * 1.6);
        line-height: 0.9;
      }
      .p-text.t-Eyebrow {
        opacity: 0.9;
      }
      .p-text.t-Hosts.em-secondary,
      .p-text.t-Description {
        opacity: 0.9;
      }
      .p-cta {
        display: inline-flex;
      }
      .p-rsvp {
        container-type: inline-size;
        width: 100%;
        align-self: stretch;
        flex: none;
      }
      .p-stack
        > :is(
          .p-stack,
          .p-cluster,
          .p-split,
          .p-rail,
          .p-grid,
          .p-frame,
          .p-surface,
          .p-overlay,
          .p-rsvp,
          .p-registry,
          .p-item,
          .p-field,
          .p-band,
          .p-rule,
          .p-divider
        ) {
        align-self: stretch;
        width: 100%;
      } /* a Stack's alignment aligns leaves; containers and components always take the full width */
      .rsvp-form {
        display: grid;
        gap: var(--gap, 22px);
        text-align: left;
      }
      .rsvp-form .blk {
        display: grid;
        gap: 12px;
      }
      @container (min-width:640px) {
        .rsvp-form {
          grid-template-columns: 1fr 1fr;
          column-gap: clamp(24px, 4vw, 56px);
        }
        .rsvp-form .span {
          grid-column: 1 / -1;
        }
      }
      .p-registry {
        width: 100%;
        align-self: stretch;
        text-align: left;
      }
      .p-registry .p-item {
        min-width: 0;
        height: 100%;
      }
      .p-registry .card {
        height: 100%;
      }
      .p-registry .item .body {
        margin-top: 14px;
      }
      .p-registry .item .btn {
        margin-top: 14px;
      }
      .p-registry .item.featured {
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        gap: 22px;
      }
      .p-registry .item.featured .body {
        margin-top: 0;
      }
      .p-registry.list .p-stack {
        gap: 0;
      }
      .p-registry.list .item {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 22px;
        align-items: center;
        padding: 20px 0;
        border-top: var(--rule);
        background: transparent;
        border-left: 0;
        border-right: 0;
        border-bottom: 0;
        outline: 0;
      }
      .p-registry.list .p-item:last-child .item {
        border-bottom: var(--rule);
      }
      .p-registry.list .item .body {
        margin-top: 0;
      }
      .p-registry.list .item .thumb {
        aspect-ratio: 1;
      }
      .p-registry .return {
        margin-top: var(--gap, 22px);
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 0.9rem;
      }
      .p-item.standalone {
        max-width: 560px;
      }

      /* ---------- mobile (compiler-owned breakpoint; honours the tree's mobile intents) ---------- */
      @media (max-width: 700px) {
        .sec .inner {
          width: calc(100% - 32px) !important;
          margin-left: 16px !important;
          margin-right: 16px !important;
        }
        .site .two {
          grid-template-columns: 1fr;
        }
        .p-split.m-stack,
        .p-split.m-stack-reverse {
          grid-template-columns: 1fr;
        }
        .p-split.m-stack-reverse > :first-child {
          order: 2;
        }
        .p-split.m-keep {
          grid-template-columns: var(--mcols);
          gap: 14px;
        }
        .p-split.m-stack.div-hairline > :first-child,
        .p-split.m-stack.div-strong > :first-child,
        .p-split.m-stack.div-dashed > :first-child {
          border-right: 0;
          padding-right: 0;
          border-bottom: var(--rule);
          padding-bottom: 16px;
        }
        .p-split.m-stack.div-dashed > :first-child {
          border-bottom: 2px dashed color-mix(in srgb, currentColor 45%, transparent);
        }
        .p-split.m-stack-reverse.div-hairline > :last-child,
        .p-split.m-stack-reverse.div-strong > :last-child,
        .p-split.m-stack-reverse.div-dashed > :last-child {
          border-bottom: var(--rule);
          padding-bottom: 16px;
        }
        .p-split.m-stack-reverse.div-hairline > :first-child,
        .p-split.m-stack-reverse.div-strong > :first-child,
        .p-split.m-stack-reverse.div-dashed > :first-child {
          border-right: 0;
          padding-right: 0;
        }
        .p-rail,
        .p-rail.side-end {
          grid-template-columns: 1fr;
        }
        .p-rail .rail,
        .p-rail.side-end .rail {
          order: 0;
          border: 0;
          padding: 0;
          border-bottom: var(--rule-strong);
          padding-bottom: 14px;
        }
        .p-rail.m-bottom .rail {
          order: 2;
          border-bottom: 0;
          border-top: var(--rule-strong);
          padding-top: 14px;
          padding-bottom: 0;
        }
        .p-rail.m-hide .rail {
          display: none;
        }
        .p-rail .rail .p-field {
          min-height: var(--rail-w);
        }
        .p-rail.w-thin .rail .p-stack {
          writing-mode: horizontal-tb;
          transform: none;
          flex-direction: row;
          flex-wrap: wrap;
          gap: 8px 18px;
        }
        .p-rail.w-thin .rail .p-stack .p-text {
          white-space: normal;
        }
        .p-grid {
          grid-template-columns: repeat(var(--mcols), minmax(0, 1fr));
        }
        .p-cell {
          grid-column: span min(var(--span), var(--mcols));
        }
        .p-grid.ruled .p-cell {
          padding: 14px;
          min-height: 90px;
        }
        .p-frame {
          padding: calc(var(--inset) * 0.6);
        }
        .p-frame .frame-box {
          padding: 32px 18px;
        }
        .p-surface {
          padding: calc(var(--inset) * 0.6);
        }
        .p-overlay:not(.ext-full) .ov-content {
          padding: 0;
        }
        .p-overlay.m-stack .ov-deco {
          position: static;
          width: 100%;
          height: auto;
          transform: none;

        const PATTERN = {
          plaid: (s, o) =>
            `repeating-linear-gradient(0deg,${cm(o * 0.55)} 0 1px,transparent 1px ${24 * s}px),repeating-linear-gradient(90deg,${cm(o * 0.55)} 0 1px,transparent 1px ${24 * s}px),repeating-linear-gradient(0deg,transparent 0 ${94 * s}px,${cm(o)} ${94 * s}px ${98 * s}px,transparent ${98 * s}px ${120 * s}px),repeating-linear-gradient(90deg,transparent 0 ${94 * s}px,${cm(o)} ${94 * s}px ${98 * s}px,transparent ${98 * s}px ${120 * s}px)`,
          stripe: (s, o) =>
            `repeating-linear-gradient(0deg,${cm(o)} 0 ${5 * s}px,transparent ${5 * s}px ${14 * s}px)`,
          gingham: (s, o) =>
            `repeating-linear-gradient(0deg,${cm(o * 0.5)} 0 ${18 * s}px,transparent ${18 * s}px ${36 * s}px),repeating-linear-gradient(90deg,${cm(o * 0.5)} 0 ${18 * s}px,transparent ${18 * s}px ${36 * s}px)`,
          linen: (s, o) =>
            `repeating-linear-gradient(0deg,${cm(o * 0.6)} 0 1px,transparent 1px ${3 * s}px),repeating-linear-gradient(90deg,${cm(o * 0.35)} 0 1px,transparent 1px ${4 * s}px)`,
        };
        const GLYPH = {
          equestrian: [
            `<path d="M6 22a10 10 0 1 1 20 0v6h-4v-6a6 6 0 1 0-12 0v6H6z"/>`,
            `<circle cx="16" cy="16" r="10"/><path d="M2 16h28"/>`,
          ],
          botanical: [
            `<path d="M16 30V4M16 12c-5 0-9-3-10-7 5 0 9 3 10 7zM16 20c5 0 9-3 10-7-5 0-9 3-10 7zM16 26c-5 0-9-3-10-7 5 0 9 3 10 7z"/>`,
          ],
          celestial: [
            `<path d="M16 2l3 11 11 3-11 3-3 11-3-11-11-3 11-3z"/>`,
            `<circle cx="16" cy="16" r="3"/>`,
          ],
        };
        const glyph = (id0, size, i = 0, rot = 0) => {
          const id = GLYPH[id0] ? id0 : "celestial";
          return `<svg width="${size}" height="${size}" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" style="transform:rotate(${rot}deg)">${GLYPH[id][i % GLYPH[id].length]}</svg>`;
        };
        function arrangement(id, role, scale, seed) {
          let r = seed;
          const rnd = () => {
            r = (r * 1103515245 + 12345) & 0x7fffffff;
            return r / 0x7fffffff;
          };
          const base = 26 * scale;
          if (role === "accent")
            return `<span class="glyphs">${glyph(id, base, 0, Math.round(rnd() * 20 - 10))}${rnd() > 0.5 ? glyph(id, base * 0.7, 1, Math.round(rnd() * 30 - 15)) : ""}</span>`;
          const n = 3 + Math.floor(rnd() * 2);
          let s = "";
          for (let i = 0; i < n; i++) s += glyph(id, base * 0.75, i, Math.round(rnd() * 40 - 20));
          return `<span class="glyphs">${s}</span>`;
        }
        const pattern = (motif, opacity, scale) =>
          motif && PATTERN[motif.id] ? PATTERN[motif.id](scale, opacity) : PATTERN.linen(1, 0.12);
        const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

        // ---------- shared semantic components (identical DOM everywhere) ----------
        function rsvpForm() {
          return `<form class="rsvp-form" onsubmit="return false">
  <div class="blk span err"><label class="fld"><span>Guest name</span><input value="Sam"></label><div class="err-msg">We found more than one invitation. Enter a last name too.</div><div class="muted small">Possible matches: Samir &amp; Layla · Sami &amp; Noor</div></div>
  <div class="blk span"><div class="kicker">Text verification</div><div class="otp"><span>4</span><span>1</span><span>7</span><span>•</span><span>•</span><span>•</span></div></div>
  <div class="blk"><div class="kicker">Your party · Marissa &amp; Eren</div><label class="choice"><input type="checkbox" checked><span><b>Marissa</b><br><span class="muted">Attending</span></span></label><label class="choice"><input type="checkbox" checked><span><b>Eren</b><br><span class="muted">Attending</span></span></label></div>
  <div class="blk"><div class="kicker">Meal preference</div><div class="two"><label class="choice"><input type="radio" checked><span>Chicken</span></label><label class="choice"><input type="radio"><span>Vegetarian</span></label></div><label class="fld"><span>Any dietary restrictions?</span><textarea placeholder="Optional"></textarea></label></div>
  <div class="blk span err"><label class="fld"><span>What song should we add to the playlist?</span><input placeholder="Your answer"></label><div class="err-msg">Please answer this question before submitting.</div></div>
  <div class="blk span"><a class="btn">Submit RSVP</a></div></form>`;
        }
        const ITEM = {
          gift: (f) =>
            `<div class="card item ${f ? "featured" : ""}"><div class="thumb">gift</div><div class="body"><div class="kicker">Native gift</div><h3>Natural oak activity gym</h3><p class="muted">$89 · 1 requested</p><a class="btn">Buy this gift</a></div></div>`,
          external: () =>
            `<div class="card item"><div class="thumb">A</div><div class="body"><div class="kicker">External registry</div><h3>Amazon Baby Registry</h3><p class="muted">Shop the full registry on Amazon.</p><a class="btn">Shop registry</a></div></div>`,
          cashfund: () =>
            `<div class="card item"><div class="thumb">$</div><div class="body"><div class="kicker">Cash fund</div><h3>Nursery fund</h3><p class="muted">Venmo @haseeb · $25 · $50 · $100</p><a class="btn">Send a gift</a></div></div>`,
        };
        const returnPrompt = () =>
          `<div class="return"><b>Did you buy this gift?</b><a class="btn">Yes, mark purchased</a><a class="btn ghost">No</a></div>`;
        const HEADING = {
          details: "Join us at the lodge.",
          rsvp: "Will you be there?",
          registry: "A few things we love.",
        };

        // ---------- node renderers ----------
        function render(spec, opts) {
          const {
            composition: tree,
            layout,
            designIntent: di,
            pageSystem: ps,
            content: D,
            seed = 1,
          } = spec;
          const L = (id) => layout[id] || {};
          let glyphSeed = seed * 7919;
          const R = {
            Stack: (n) =>
              `<div class="p-stack ${n.align ? "al-" + n.align : ""}" data-id="${n.id}" style="--gap:${L(n.id).gapPx}px">${n.children.map(N).join("")}</div>`,
            Cluster: (n) =>
              `<div class="p-cluster j-${n.justify}" data-id="${n.id}" style="--gap:${L(n.id).gapPx}px">${n.children.map(N).join("")}</div>`,
            Split: (n) =>
              `<div class="p-split m-${n.mobile} al-${n.align} div-${n.divider || "none"}" data-id="${n.id}" style="--cols:${L(n.id).first}fr ${100 - L(n.id).first}fr;--mcols:${n.mobile === "keep" ? Math.max(38, Math.min(62, L(n.id).first)) + "fr " + (100 - Math.max(38, Math.min(62, L(n.id).first))) + "fr" : "1fr"}">${n.children.map(N).join("")}</div>`,
            Rail: (n) =>
              `<div class="p-rail side-${n.side} w-${n.width} m-${n.mobile}" data-id="${n.id}" style="--rail-w:${L(n.id).widthPx}px"><div class="rail">${N(n.rail)}</div><div class="main">${N(n.child)}</div></div>`,
            Grid: (n) =>
              `<div class="p-grid ${n.ruled ? "ruled" : ""}" data-id="${n.id}" style="--cols:${n.columns};--mcols:${n.mobile};--gap:${L(n.id).gapPx}px">${n.children.map(N).join("")}</div>`,
            Cell: (n) =>
              `<div class="p-cell" data-id="${n.id}" style="--span:${n.span};--rspan:${n.rowSpan}">${N(n.child)}</div>`,
            Frame: (n) =>
              `<div class="p-frame" data-id="${n.id}" style="--inset:${L(n.id).insetPx}px;background:${n.motif ? pattern(n.motif, 0.22, 1.5) : "transparent"}"><div class="frame-box rule-${n.rule}">${N(n.child)}</div></div>`,
            Surface: (n) =>
              `<div class="p-surface surf-${n.role}" data-id="${n.id}" style="--inset:${L(n.id).insetPx}px">${N(n.child)}</div>`,
            Overlay: (n) =>
              `<div class="p-overlay anchor-${n.anchor} ext-${n.extent} m-${n.mobile}" data-id="${n.id}"><div class="ov-content">${N(n.content)}</div><div class="ov-deco">${N(n.decoration)}</div></div>`,
            MotifField: (n) =>
              `<div class="p-field ext-${n.extent}" data-id="${n.id}" style="background:${pattern(n.motif, 0.16, 1.5)}"></div>`,
            MotifBand: (n) =>
              `<div class="p-band ${n.fill === "accent" ? "accent" : ""}" data-id="${n.id}" style="height:${L(n.id).heightPx}px;${n.fill === "accent" ? "" : "background:" + pattern(n.motif, 0.22, 2)}"></div>`,
            Rule: (n) =>
              n.orientation === "v"
                ? `<div class="p-rule v w-${n.weight}" data-id="${n.id}"></div>`
                : n.glyphs
                  ? `<div class="p-divider w-${n.weight}" data-id="${n.id}">${arrangement(n.glyphs, "divider", 1, glyphSeed++)}</div>`
                  : `<div class="p-rule w-${n.weight}" data-id="${n.id}"></div>`,
            Glyph: (n) =>
              `<div class="p-glyph" data-id="${n.id}">${arrangement(n.motif, "accent", { s: 0.75, m: 1, l: 1.5 }[n.scale], glyphSeed++)}</div>`,
            Monogram: (n) =>
              `<div class="p-mono st-${n.style}" data-id="${n.id}"><span>${esc(D.initial)}</span></div>`,
            EventTitle: (n) => {
              const words = D.title.split(" ");
              const lines =
                n.layout === "block"
                  ? null
                  : [
                      words.slice(0, 2).join(" "),
                      words.slice(2, 4).join(" "),
                      words.slice(4).join(" "),
                    ].filter(Boolean);
              return `<h1 class="p-text t-EventTitle em-${n.emphasis} case-${n.case} lay-${n.layout}" data-id="${n.id}" data-t="text">${lines ? lines.map((l) => `<span class="line">${esc(l)}</span>`).join("") : esc(D.title)}</h1>`;
            },
            Date: (n) => {
              const txt =
                n.form === "numeral"
                  ? D.dayNumeral
                  : n.form === "month-year"
                    ? `${D.monthShort} ${D.year}`
                    : n.form === "weekday"
                      ? D.weekday
                      : D.date;
              return `<div class="p-text t-Date form-${n.form} em-${n.emphasis}" data-id="${n.id}" data-t="text">${esc(txt)}</div>`;
            },
            CTA: (n) =>
              `<div class="p-cta" data-id="${n.id}"><a class="${n.style === "link" ? "link" : "btn"}">${n.target === "rsvp" ? "RSVP" : "Registry"}</a></div>`,
            SectionHeading: (n) =>
              `<h2 class="p-text t-Heading em-${n.emphasis}" data-id="${n.id}" data-t="text">${HEADING[n.for]}</h2>`,
            RSVP: (n) => `<div class="p-rsvp" data-id="${n.id}">${rsvpForm()}</div>`,
            Registry: (n) =>
              `<div class="p-registry ${n.layout.t === "Stack" ? "list" : ""}" data-id="${n.id}">${N(n.layout)}${returnPrompt()}</div>`,
            RegistryItem: (n) =>
              `<div class="p-item" data-id="${n.id}">${ITEM[n.kind](n.emphasis === "featured")}</div>`,
            CashFund: (n) =>
              `<div class="p-item standalone" data-id="${n.id}">${ITEM.cashfund()}</div>`,
          };
          const TEXT = {
            Eyebrow: "eyebrow",
            Hosts: "hosts",
            Description: "description",
            Deadline: "deadline",
            Venue: "venue",
            Location: "location",
            Time: "time",
          };
          function N(n) {
            if (R[n.t]) return R[n.t](n);
            if (TEXT[n.t])
              return `<div class="p-text t-${n.t} em-${n.emphasis} case-${n.case || "none"}" data-id="${n.id}" data-t="text">${esc(D[TEXT[n.t]])}</div>`;
            return `<!-- ${n.t} -->`;
          }
          const secs = tree.sections
            .map(
              (s) =>
                `<section class="sec kind-${s.kind} surf-${s.surface} al-${s.align} fill-${s.fill}" data-id="${s.id}">${s.kind === "band" ? N(s.root) : `<div class="inner">${N(s.root)}</div>`}</section>`,
            )
            .join("");
          return `<div class="site fam-${di.family} hier-${di.composition.hierarchy} tone-${di.tonalDirection} btn-${ps.button}" style="${vars(spec, opts)}">${secs}<footer class="sec surf-${tree.sections[tree.sections.length - 1].surface} footer">Made with Cordially</footer></div>`;
        }
        function vars(spec, { w, vh }) {
          const { designIntent: di, pageSystem: ps } = spec;
          const t = TONES[di.tonalDirection],
            h = HIER[di.composition.hierarchy],
            d = DENS[di.density];
          const b = BORDER[ps.border](ps.borderWeight || 1),
            c = CARD[ps.card],
            bt = BTN[ps.button],
            ty = spec.typography;
          return `--t-base:${t.base};--t-alt:${t.alt};--t-contrast:${t.contrast};--t-contrast-text:${t.contrastText};--t-text:${t.text};--t-error:${t.error};--t-acc-base:${t.accBase};--t-acc-base-fg:${t.accBaseFg};--t-acc-contrast:${t.accContrast};--t-acc-contrast-fg:${t.accContrastFg};
      --display:'${ty.display}',Georgia,serif;--body:'${ty.body}',Arial,sans-serif;--display-weight:${ty.category === "grotesk_led" ? 800 : 600};--display-weight-heavy:${ty.category === "grotesk_led" ? 900 : 700};
      --display-size:${h.d};--h2-size:${h.h2};--tracking:${ps.displayTracking || 0}em;--pad-y:${w <= 700 ? d.m : d.d}px;--measure:62ch;
      --hero-h:${Math.round((w <= 700 ? 0.72 : 0.8) * vh)}px;--rule-w:${ps.borderWeight || 1}px;--rule:${b.rule};--rule-strong:${b.strong};--rule-outline:${b.outline};--field-border:${b.field};--field-border-b:${b.fieldB || b.field};
      --card-bg:${c.bg};--card-border:${c.border};--card-outline:${c.outline};--btn-bg:${bt.bg};--btn-fg:${bt.fg};--btn-border:${bt.border};--btn-radius:${bt.radius};--btn-tracking:${bt.tr};--btn-transform:${bt.tf};--btn-size:${bt.size};--pattern-linen:${PATTERN.linen(1, 0.16)};`;
        }
        // ---------- geometry measurement (content fit is verified against this, not estimated) ----------
        function measure(vpWidth, mode) {
          const vp = document.querySelector(".vp") || document.documentElement;
          const out = {
            mode,
            vpWidth,
            pageOverflow: vp.scrollWidth > vp.clientWidth + 1,
            texts: [],
            overflowing: [],
          };
          for (const el of document.querySelectorAll("[data-t=text]")) {
            const cs = getComputedStyle(el);
            if (cs.writingMode.startsWith("vertical") || el.closest(".ov-deco")) continue;
            /* rotated rail labels cannot be measured by width; decorations are clipped watermarks by rule */ const lh =
              parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) * 1.2;
            const r = el.getBoundingClientRect();
            const lines = Math.max(1, Math.round(r.height / lh));
            const pr = el.parentElement.getBoundingClientRect();
            const overflow =
              el.scrollWidth > el.clientWidth + 2 || r.right > pr.right + 2 || r.left < pr.left - 2; // wider than itself, or wider than its container
            out.texts.push({
              id: el.dataset.id,
              cls: el.className,
              lines,
              overflow,
              fontPx: parseFloat(cs.fontSize),
            });
          }
          for (const el of document.querySelectorAll(".site *")) {
            const cs = getComputedStyle(el);
            if (
              cs.writingMode.startsWith("vertical") ||
              (el.closest(".rail") &&
                getComputedStyle(el.closest(".rail")).writingMode.startsWith("vertical"))
            )
              continue;
            if (el.classList.contains("glyphs") || el.closest(".glyphs")) {
              if (el.classList.contains("glyphs")) {
                const gr = el.getBoundingClientRect(),
                  pr = el.parentElement.getBoundingClientRect();
                if (gr.right > pr.right + 2 || gr.left < pr.left - 2)
                  out.overflowing.push("glyphs:" + (el.closest("[data-id]") || {}).dataset?.id);
              }
              continue;
            }
            if (
              el.scrollWidth > el.clientWidth + 2 &&
              cs.overflowX !== "hidden" &&
              !el.closest("[data-t=text]") &&
              !el.closest(".rail") &&
              !el.closest(".ov-deco")
            ) {
              out.overflowing.push(el.dataset.id || el.className);
              if (out.overflowing.length > 8) break;
            }
          }
          // rails clip; report a rail child that would be clipped as an overflow of the rail
          for (const rail of document.querySelectorAll(".p-rail .rail")) {
            const rr = rail.getBoundingClientRect();
            for (const ch of rail.querySelectorAll("[data-t=text]")) {
              const cr = ch.getBoundingClientRect();
              if (cr.right > rr.right + 2 || cr.left < rr.left - 2) {
                out.overflowing.push("rail-clip:" + ch.dataset.id);
                break;
              }
            }
          }
          const hero = document.querySelector(".kind-hero");
          out.heroHeight = hero ? hero.getBoundingClientRect().height : 0;
          const hr = document.querySelector(".kind-hero .inner > *");
          if (hr) {
            const cs = getComputedStyle(hr);
            out.heroRoot = {
              cls: hr.className,
              height: hr.getBoundingClientRect().height,
              minHeight: cs.minHeight,
              display: cs.display,
            };
          }
          return out;
        }
        root.Renderer = { render, measure, TONES, PATTERN };
      })(window);
    </script>
    <script>
      window.onerror = (m, src, line, col) => {
        window.__SPIKE_ERROR = m + " @" + line + ":" + col;
      };
      (function () {
        const w = window.__SPIKE_WIDTH || 390,
          vh = w <= 700 ? 844 : 800,
          mode = w <= 700 ? "mobile" : "desktop";
        const DATA = window.DATA;
        DATA.initial = "B";
        DATA.weekday = "Saturday";
        const site = window.SITES.find((s) => s.id === "01");
        const row = LIBRARY.A1_SITES.find((r) => r[0] === "01");
        const tree = LIBRARY.page(row[1], row[2], row[3], row[4], row[5], row[6]);
        const designIntent = {
          family: site.family,
          tonalDirection: site.tonalDirection,
          typography: site.typography,
          density: site.density,
          composition: site.composition,
        };
        const pageSystem = {
          border: site.pageSystem.border,
          card: site.pageSystem.card,
          button: site.pageSystem.button,
          borderWeight: site.parameters.borderWeight,
          displayTracking: site.parameters.displayTracking,
        };
        const { tree: canon } = Composition.canonicalize(tree);
        const spec = {
          composition: canon,
          layout: Composition.resolveLayout(canon, designIntent.density),
          designIntent,
          pageSystem,
          typography: VOCAB.typography[designIntent.typography],
          content: DATA,
          seed: parseInt("01", 10),
        };
        document.body.style.background = "#fff";
        const vp = document.createElement("div");
        vp.className = "vp";
        vp.style.width = w + "px";
        vp.innerHTML = Renderer.render(spec, { w, vh });
        document.body.appendChild(vp);
        document.fonts.ready.then(() => {
          const fonts = ["Libre Caslon Text", "Karla"].map((f) => ({
            family: f,
            loaded: document.fonts.check("16px '" + f + "'"),
          }));
          const m = Renderer.measure(w, mode);
          window.__SPIKE_RESULT = {
            width: w,
            mode,
            fonts,
            fontFaces: document.fonts.size,
            docWidth: document.documentElement.scrollWidth,
            docHeight: document.documentElement.scrollHeight,
            measure: m,
          };
        });
      })();
    </script>
  </body>
</html>
