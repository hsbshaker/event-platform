name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, unit, component, build, browser
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:component
      # Before the browser suite, and not only as its own check: the browser gate measures the
      # stylesheet this build emits, and the hydrated harness is bundled from the same source.
      - run: npm run build
      # The interaction gate. `playwright-core` is the dependency this repository actually declares,
      # and its own CLI installs the Chromium revision that version expects. `npx playwright …`
      # would fetch whatever the registry's latest `playwright` happens to be, install *its*
      # revision, and leave `chromium.executablePath()` — resolved by playwright-core 1.63 —
      # pointing at a directory that does not exist, so the browser gate would silently stop
      # running the moment the two drifted apart.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e

  db:
    name: Migrations and RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:db

  renderer-proof:
    name: proof-b regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run proof:test
